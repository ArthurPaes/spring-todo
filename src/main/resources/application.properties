spring.application.name=todo
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true

# Hardcoded fallback is fine for local-dev learning only -- a real production
# secret should never have a committed default; use JWT_SECRET with no fallback,
# or a proper secrets manager, so a deploy fails fast if it's not explicitly set.
app.jwt.secret=${JWT_SECRET:yoY8mj4tERqxnpJBaCkYPret7OKuLS/YeqWe20N6Q4qywGbqqotFRFvqGNsMhHsxSPtuBoMvN60SPspY60ch7g==}
